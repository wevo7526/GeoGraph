# Where a state actor sits on a globe: ISO3 → [latitude, longitude].
#
# The graph knows an actor's identity (`iso3`, `cow_ccode`) and its behaviour,
# and nothing at all about where it IS. Events carry `geo_lat`/`geo_lng`, but
# those are the wrong instrument for placing an ACTOR: an event is geocoded
# where it LANDED, so a centroid of United States events sits somewhere over
# Iraq. Where a state acts is not where a state is.
#
# CENTROIDS, NOT CAPITALS, and that is a deliberate choice on a platform about
# contested sovereignty. A capital is the sharper anchor — it is where the
# government sits, and this archive is about state behaviour — but choosing one
# means ruling on capitals that are themselves disputes the archive is supposed
# to describe rather than adjudicate. A geographic centroid says only "this is
# roughly where this country is", which is all a globe needs and the most the
# data should be made to assert.
#
# Approximate to about a degree. They position a marker on a sphere; nothing
# downstream measures with them, and nothing may start to — a coordinate here
# is a drawing instruction, not evidence.
#
# Keys are the same ISO3 the packs' actors carry (`iso3` in packs/*/actors.yaml).
# A roster member missing from this file simply does not get placed, which is
# why the test asserts full coverage rather than letting one silently vanish.

