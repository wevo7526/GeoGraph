# FIPS 10-4 country code → ISO 3166-1 alpha-3.
#
# GDELT geo-codes every event's ACTION location in FIPS 10-4 (two letters, and
# not the ISO two-letter codes: GM is Germany, AS is Australia, UP is Ukraine,
# RS is Russia, KS is South Korea), while the packs anchor actors to GDELT's
# ACTOR country codes, which are ISO3-like CAMEO codes. This crosswalk lets the
# wire parser say, deterministically, WHOSE TERRITORY an event happened on —
# the fact behind the co-participation flag (see core/ingestion/gdelt.py):
# two ALLIES coded in material conflict with each other on a THIRD country's
# soil are, in the overwhelming case, fighting TOGETHER there, and GDELT's
# dyadic coding cannot say so on its own.
#
# Roster-scoped: every pack actor's country plus the theatres those actors
# recur in. A FIPS code absent here maps to '' (unknown), which never fires
# the flag — the parser infers nothing from a code it cannot place. Extend by
# adding rows; the parser reads the file at import.
#
# Source: US NGA GEOnet FIPS 10-4 list, cross-checked against ISO 3166-1.
fips_to_iso3:
