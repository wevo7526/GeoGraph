# The Eurasia marquee spine — curated, day-resolution, CODED.
#
# THE SAME DISCIPLINE AS THE OTHER PACKS: pre-2015 ARMED disputes live in the
# COW MIDs, and coding them again here would fold a dyad's baseline twice. So
# the deep rows are diplomatic and economic — the treaties, the partitions and
# the sanctions — and the armed record before 2015 arrives through the deep
# tier on its own. Two consequences a reader should expect: the 1948 Berlin
# blockade, Hungary 1956, Prague 1968, Afghanistan 1979 and Georgia 2008 are
# NOT in this file, and they are not missing from the archive either.
#
# Codes are the archive's CAMEO vocabulary (core/ontology/crosswalks). Two
# notes on coding choices that would otherwise look arbitrary:
#   - Multilateral accessions are coded on the BILATERAL dyad where the
#     commitment actually binds (NATO 1949 on US-UK, the 1999 and 2004 rounds
#     on the US and the acceding state), the same convention the China pack
#     used for the WTO.
#   - The Wall's opening is 081, easing administrative restrictions. CAMEO
#     puts root 08 (Yield) in MATERIAL cooperation, which reads oddly for a
#     border crossing and is nonetheless the vocabulary's call, not ours.

events:
  - id: event:eurasia-1939-molotov-ribbentrop
    date: "1939-08-23"
    name: Molotov–Ribbentrop Pact signed in Moscow
    quad_class: verbal_cooperation
    cameo: "057"
    initiator: actor:cow-255
    target: actor:cow-365
    note: >-
      The archive's starkest demonstration that the quad class is a coding of
      the ACTION, not of the consequence: a signed agreement between two
      states scores as cooperation on their dyad, and the week it bought was
      the week the war began. Read the market effect, not the label.
  - id: event:eurasia-1945-yalta
    date: "1945-02-11"
    name: Yalta Conference concludes
    quad_class: verbal_cooperation
    cameo: "057"
    initiator: actor:cow-2
    target: actor:cow-365
    note: The postwar order agreed on the US–Soviet dyad that would then contest it.
  - id: event:eurasia-1949-nato
    date: "1949-04-04"
    name: North Atlantic Treaty signed in Washington
    quad_class: verbal_cooperation
    cameo: "057"
    initiator: actor:cow-2
    target: actor:cow-200
  - id: event:eurasia-1955-warsaw-pact
    date: "1955-05-14"
