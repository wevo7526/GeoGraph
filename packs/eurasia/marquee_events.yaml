  - id: event:eurasia-2014-sectoral-sanctions
    date: "2014-07-29"
    name: US and EU sectoral sanctions on Russia
    quad_class: material_conflict
    cameo: "163"
    initiator: actor:cow-2
    target: actor:cow-365
    note: >-
      The economic answer to Crimea and the Donbas, coded here rather than
      the annexation itself — 2014 is inside MID coverage, the sanctions are
      not a militarized dispute, and this is the row that does not double-fold.
  - id: event:eurasia-2022-invasion
    date: "2022-02-24"
    name: Russia invades Ukraine
    quad_class: material_conflict
    cameo: "190"
    initiator: actor:cow-365
    target: actor:cow-369
    phase0_candidate: true
    note: >-
      The largest interstate war in Europe since 1945, and the first event in
      the archive whose transmission runs through every channel this pack
      carries at once — energy, grain, the industrial index and the haven.
  - id: event:eurasia-2022-reserve-freeze
    date: "2022-02-26"
    name: Russian central-bank reserves frozen; banks cut from SWIFT
    quad_class: material_conflict
    cameo: "163"
    initiator: actor:cow-2
    target: actor:cow-365
    phase0_candidate: true
    note: >-
      Roughly half of Russia's reserves immobilised over a weekend. The
      case study's second half: the financial system used as a weapon
      against a state that had spent a decade preparing for sanctions on
      everything except its reserves.
  - id: event:eurasia-2022-mobilization
    date: "2022-09-21"
    name: Russian partial mobilization announced
    quad_class: material_conflict
    cameo: "153"
    initiator: actor:cow-365
    target: actor:cow-369
  - id: event:eurasia-2023-grain-deal-ends
    date: "2023-07-17"
    name: Russia withdraws from the Black Sea Grain Initiative
    quad_class: material_conflict
    cameo: "163"
    initiator: actor:cow-365
    target: actor:cow-369
    note: The grain channel closed deliberately — ZW=F is the sensor.
  - id: event:eurasia-2024-sweden-nato
    date: "2024-03-07"
    name: Sweden accedes to NATO
    quad_class: verbal_cooperation
    cameo: "057"
    initiator: actor:cow-2
    target: actor:cow-380
    note: >-
      Two centuries of non-alignment ended as a consequence of the invasion —
      the clearest case in the archive of an escalation producing the exact
      structural outcome it was meant to prevent.
  - id: event:eurasia-2025-riyadh-talks
    date: "2025-02-18"
    name: US–Russia talks on Ukraine open in Riyadh
    quad_class: verbal_cooperation
    cameo: "046"
    initiator: actor:cow-2
    target: actor:cow-365
    note: >-
      The first direct bilateral engagement of the war, held without Ukraine
      in the room. Coded as negotiation on the US–Russia dyad, which is
      literally what it was.

case_study:
  slug: february-rupture
  title: The February Rupture
  dek: >-
    An invasion and a reserve freeze, two days apart. One episode, two dyads,
    and the first time the archive can watch a war and a financial weapon
    price the same continent through four separate channels.
  summary: >-
    Russian forces crossed into Ukraine on 24 February 2022; on 26 February
    the United States and its partners immobilised roughly half of Russia's
    central-bank reserves and cut major banks from SWIFT. The archive codes
    the pair as they were — conventional force on the Russia–Ukraine dyad,
    answered by economic coercion on the US–Russia dyad — and measures each
    against the baseline its OWN dyad had before the week began.
  reading: >-
    Watch the channels separate. Gas and wheat price the supply shock, the
    DAX prices the industrial economy that pays for it, and gold prices the
    exit — so the same episode produces effects of opposite sign in one
    window, which is the point of measuring rather than asserting. Then note
    what the archive CANNOT show you: MOEX is the most direct sensor for
    Russian risk in this pack, and it is exactly the series that stopped
    being observable when the risk arrived. The skip is the finding.
  caveat: >-
    Two honesty notes. The gas leg is Henry Hub, a proxy for the European
    price rather than the price itself — the free feed's TTF history is too
    thin to measure, and naming the substitute beats implying a precision the
    data does not have. And the two events are two days apart, so their
    windows overlap: the engine flags the overlap on every affected edge
    rather than averaging an invasion and a sanctions package into one number.
  events:
    - event:eurasia-2022-invasion
    - event:eurasia-2022-reserve-freeze
