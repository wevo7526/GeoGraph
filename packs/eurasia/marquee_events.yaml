      The dissolution enters the archive as what it formally was — an
      agreement signed between two of the republics that made it.
  - id: event:eurasia-1994-budapest
    date: "1994-12-05"
    name: Budapest Memorandum on security assurances
    quad_class: verbal_cooperation
    cameo: "057"
    initiator: actor:cow-365
    target: actor:cow-369
    note: >-
      Ukraine surrenders the world's third-largest nuclear arsenal against
