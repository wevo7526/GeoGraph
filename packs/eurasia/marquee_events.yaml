  - id: event:eurasia-2006-gas-cutoff
    date: "2006-01-01"
    name: Russia halts gas deliveries through Ukraine
    quad_class: material_conflict
    cameo: "163"
    initiator: actor:cow-365
    target: actor:cow-369
    note: >-
      The first time the pipeline was used openly as an instrument. Europe
      priced it as a commercial dispute; the archive codes it as what the
