# ── the GDELT externality declaration ────────────────────────────────────────
# EMPTY, AND THAT IS THE POINT. The loader's default treats USA–RUS wire
# traffic as an external-power pair and drops it, which is right for a lens
# on the Gulf or the Strait — there it is flood noise about somewhere else.
# HERE IT IS THE SPINE. A Eurasia archive that dropped the Washington–Moscow
# dyad would be an archive of the Cold War with the Cold War removed.
external_powers: []

# ── durable relations ────────────────────────────────────────────────────────
# COW's deep tier already carries the treaty alliances (NATO 1949, the Warsaw
# Treaty 1955, the post-1999 accessions) and the IGO layer. Curated here: what
# COW cannot carry — the post-1991 rivalries, the statutory commitments short
# of treaties, and the one trade dependency that became a lever.
relations:
  - a: actor:cow-365            # Russia
    b: actor:cow-369            # Ukraine
    relation_type: rivalry
    valid_from: "2014-02-27"
    source: source:crs-russia-ukraine
    note: >-
      Dated to the seizure of the Crimean parliament — the moment the
      relationship stopped being contested politics and became territorial
      conflict. The region's defining dyad.
  - a: actor:cow-365            # Russia
    b: actor:cow-2              # United States
    relation_type: rivalry
    valid_from: "2007-02-10"
    source: source:crs-russia-ukraine
    note: >-
      Dated to the Munich Security Conference speech, where Moscow declared
      the post-Cold-War settlement unacceptable in as many words. Thaw
      episodes (the 2009 reset, the 2025 talks) do not end the structure.
  - a: actor:cow-365            # Russia
    b: actor:cow-372            # Georgia
    relation_type: rivalry
    valid_from: "2008-08-07"
    source: source:crs-russia-ukraine
    note: The first post-Soviet war fought to redraw a border by force.
  - a: actor:cow-371            # Armenia
    b: actor:cow-373            # Azerbaijan
    relation_type: rivalry
    valid_from: "1988-02-20"
    source: source:crs-russia-ukraine
    note: >-
      Nagorno-Karabakh, dated to the oblast soviet's unification vote — the
      Caucasus dyad that outlived the state both belonged to.
  - a: actor:cow-365            # Russia
    b: actor:cow-370            # Belarus
    relation_type: alliance
    valid_from: "1999-12-08"
    source: source:crs-russia-ukraine
    note: >-
      The Union State treaty. Deepened into basing and launch territory in
      2022 — the alliance is why the northern axis existed.
  - a: actor:cow-2              # United States
    b: actor:cow-369            # Ukraine
    relation_type: alliance
    valid_from: "2021-11-10"
    source: source:crs-russia-ukraine
    note: >-
      The Charter on Strategic Partnership — a commitment explicitly short of
      an Article 5 guarantee, and the ambiguity is exactly what the dyad
      prices, the same way the Taiwan Relations Act is priced in the China
      lens.
  - a: actor:cow-255            # Germany
    b: actor:cow-365            # Russia
    relation_type: trade
    valid_from: "2011-11-08"
    source: source:nato-enlargement
    note: >-
      Nord Stream 1 enters service. Held as STRUCTURE rather than commerce
      because that is what it became: the dependency that priced every
      European escalation from 2014 onward.
  - a: actor:cow-365            # Russia
    b: actor:cow-705            # Kazakhstan
    relation_type: alliance
    valid_from: "1992-05-15"
    source: source:nato-enlargement
    note: >-
      The Collective Security Treaty — the stepland's standing structure, and
      the frame the January 2022 Almaty deployment ran through.

# ── IGO spotlight ────────────────────────────────────────────────────────────
# The organisations whose membership edges the COW IGO layer supplies; listed
# so a reader of this pack knows which blocs the network view is drawing.
  # ── added 2026-08-16: see packs/mena/actors.yaml. UK–Russia sat third on
  # eurasia's coercion ranking with no standing declared at all.
  - a: actor:cow-200            # United Kingdom
    b: actor:cow-365            # Russia
    relation_type: rivalry
    valid_from: "2018-03-04"
    source: source:standing-record
    note: >-
      The Salisbury poisoning and the coordinated expulsions that followed.
      Dated there rather than at Litvinenko (2006) because 2018 is when the
      rupture became declared policy on both sides.
igo_spotlight:
  - actor:igo-nato
  - actor:igo-eu
  - actor:igo-osce
