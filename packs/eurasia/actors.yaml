# Eurasia pack — region three (build-spec §16). Russia, Europe and the
# stepland: the continental system whose dyads the 20th century was organised
# around, and whose energy and grain channels the 21st century prices.
#
# COW ccodes anchor states to the deep tier; iso3 anchors them to GDELT's
# country codes. THIS ROSTER BOUNDS THE ARCHIVE (2026-08-16): the deep tier
# dates and enriches the actors named here and invents none — the packs define
# the scope, and an actor no pack names is pruned with everything hanging off it.
#
# STATES THAT NO LONGER EXIST CARRY THEIR WINDOWS AND NO iso3. The two German
# states and Czechoslovakia are real COW members with real dyads, but GDELT's
# country vocabulary is modern: DEU means Germany at every date, so giving the
# GDR an iso3 would silently route 1980s wire traffic to a state the coder
# never meant. The window (`state_from`/`state_to`) is what makes them
# queryable at the dates they existed.

actors:
  # ── the external anchor ────────────────────────────────────────────────────
  - id: actor:cow-2
    name: United States
    actor_type: state
    cow_ccode: 2
    iso3: USA

  # ── Russia and the western republics ───────────────────────────────────────
  - id: actor:cow-365
    name: Russia
    actor_type: state
    cow_ccode: 365
    iso3: RUS
    note: >-
      COW carries 365 continuously across the Empire, the USSR and the
      Federation — the archive follows COW's coding, so a 1939 event and a
      2022 event sit on the same node and the dyad baselines are comparable.
  - id: actor:cow-369
    name: Ukraine
    actor_type: state
    cow_ccode: 369
    iso3: UKR
    state_from: "1991-12-01"
  - id: actor:cow-370
    name: Belarus
    actor_type: state
    cow_ccode: 370
    iso3: BLR
    state_from: "1991-12-08"
  - id: actor:cow-359
    name: Moldova
    actor_type: state
    cow_ccode: 359
    iso3: MDA
    state_from: "1991-08-27"

  # ── the European core ──────────────────────────────────────────────────────
  - id: actor:cow-200
    name: United Kingdom
    actor_type: state
    cow_ccode: 200
    iso3: GBR
  - id: actor:cow-220
