  - id: actor:cow-255
    name: Germany
    actor_type: state
    cow_ccode: 255
    iso3: DEU
    note: >-
      COW's 255 is the German Empire through 1945 and reunified Germany from
      1990; the 1955-1990 gap is held by 260 and 265 below.
  - id: actor:cow-260
    name: German Federal Republic
    actor_type: state
    cow_ccode: 260
    state_from: "1955-05-05"
    state_to: "1990-10-03"
    note: No iso3 — see the header; GDELT's DEU is modern Germany at every date.
  - id: actor:cow-265
    name: German Democratic Republic
    actor_type: state
    cow_ccode: 265
    state_from: "1954-03-25"
    state_to: "1990-10-03"
