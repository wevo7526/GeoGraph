# Secondary instruments for finer transmission stories — sector and country
# ETFs whose responses decompose an index move. Modern era only; every ticker
# depth-verified on ingest like the markets themselves.

assets:
  - ticker: XLE
    name: Energy Select Sector SPDR
    note: US energy — the first place an oil-supply shock shows inside US equities.
  - ticker: ITA
    name: iShares US Aerospace & Defense
    note: The conflict-persistence read.
  - ticker: KSA
    name: iShares MSCI Saudi Arabia
    note: US-hours Saudi exposure — trades while Tadawul sleeps, useful for lead-lag.
  - ticker: UAE
    name: iShares MSCI UAE

# ── paper books ──────────────────────────────────────────────────────────────
# The fixed paper-trade translation of a near-term forecast (signed weight per
# ticker, blended by the frozen escalation likelihood p). THE REGION'S OWN
# reading, stated once and never fitted: escalation prices the energy premium
# and the haven and discounts the exposed Gulf indices; reversion prices their
# normalization. Mechanical, not advice.
paper_books:
  escalation:
    BZ=F: 0.40
    GC=F: 0.20
    ^TASI.SR: -0.20
    DFMGI.AE: -0.20
  reversion:
    ^TASI.SR: 0.50
    DFMGI.AE: 0.50

# ── 13F filers ───────────────────────────────────────────────────────────────
# The SWFs whose EDGAR 13F-HR filings become FLOW edges (build-spec §5.2).
# CIKs resolved against EDGAR's company search on 2026-08-11 and pinned here —
# curated data, never runtime guesses. ADIA is DELIBERATELY ABSENT: no 13F
# filer is locatable under its name as of that date, and recording the absence
# beats inventing a CIK.
swf_filers:
  - actor: actor:swf-pif
    cik: 1767640
    name: Public Investment Fund
  - actor: actor:swf-mubadala
    cik: 1704268
    name: Mubadala Investment Company
