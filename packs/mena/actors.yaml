# MENA pack — the actor roster (build-spec section 16). Region one: proves
# the model. COW ccodes anchor state actors to the deep tier; SWFs are the
# actors whose 13F FLOW edges tie geopolitics to the market layer.
#
# THIS ROSTER BOUNDS THE ARCHIVE (2026-08-16): the deep tier dates and enriches
# the actors named here and invents none — the packs define the scope, and an
# actor no pack names is pruned with everything hanging off it.

