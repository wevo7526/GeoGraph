# The market universe (build-spec decision 7): US equities and rates, TASI,
# ADX, DFM, Brent and gold. EVERY MARKET CARRIES ITS INCEPTION DATE — Gulf
# markets have NO pre-founding data and the transmission engine skips a market
# that did not exist at event time rather than emitting a null row.
#
# `native_frequency` is era-keyed (year a resolution becomes available →
# TemporalResolution): the fidelity gradient per market. Deep-past US equity
# runs monthly on Shiller from 1871; the daily era starts with the modern
# index. VERIFY EACH TICKER'S DEPTH ON INGEST — yfinance history for Gulf
# indices starts later than the exchange's founding, and the verified depth is
# recorded at ingest, not assumed from this file.

markets:
  - id: market:gspc
    name: S&P 500
    ticker: "^GSPC"
    market_type: equity_index
    trading_calendar: us
    inception_date: "1871-01-01"   # Shiller monthly series; daily index from 1927
    native_frequency: '{"1871": "month", "1927": "day"}'
  - id: market:tasi
    name: Tadawul All Share Index (Saudi Arabia)
    ticker: "^TASI.SR"
    market_type: equity_index
    trading_calendar: gulf
    inception_date: "1985-01-01"   # Tadawul founded 1985; NO earlier data exists
    native_frequency: '{"1985": "day"}'
  # The UAE exchanges changed their week in January 2022 when the country did;
  # Saudi Arabia did not. MEASURED from the loaded panel over 2024-2025:
  #   ^TASI.SR   Sun 71  Mon 78  Tue 79  Wed 79  Thu 79  Fri 0  → gulf, Sun-Thu
  #   DFMGI.AE   Sun  0  Mon 78  Tue 79  Wed 80  Thu 81  Fri 0  → uae,  Mon-Thu
  # So DFM is neither `gulf` (it is shut on Sunday) nor `us` (shut on Friday,
  # 0 sessions out of 78). Without the era override the engine would look for
  # DFM's reaction on a day the exchange is closed and mis-assign first_mover
  # in the twelve-day-war case study.
  - id: market:dfmgi
    name: Dubai Financial Market General Index
    ticker: "DFMGI.AE"
    market_type: equity_index
    trading_calendar: gulf
    calendar_eras: '{"2000": "gulf", "2022": "uae"}'
    inception_date: "2000-03-26"
    native_frequency: '{"2000": "day"}'
  - id: market:adx
    name: FTSE ADX General Index (Abu Dhabi)
    # NO DATA on this ticker as of 2026-08: Yahoo reports it delisted, so the
    # transmission engine records skipped_no_data for every event rather than
    # measuring it. Kept in the pack because the market is real and the ticker
    # is the fixable part — the depth report is what surfaces this.
    ticker: "FADX15.FGI"
    market_type: equity_index
    trading_calendar: gulf
    calendar_eras: '{"2000": "gulf", "2022": "uae"}'
    inception_date: "2000-11-15"
    native_frequency: '{"2000": "day"}'
  - id: market:brent
    name: Brent crude
    ticker: "BZ=F"
    market_type: commodity
    trading_calendar: global_futures
    inception_date: "1861-01-01"   # long-run annual oil series; futures from 1988
    native_frequency: '{"1861": "year", "1988": "day"}'
  - id: market:gold
    name: Gold
    ticker: "GC=F"
    market_type: commodity
    trading_calendar: global_futures
    inception_date: "1905-01-01"   # long-run annual gold price; futures from 1974
    native_frequency: '{"1905": "year", "1974": "day"}'
  - id: market:dgs2
    name: US 2-Year Treasury yield
    ticker: DGS2
    market_type: sovereign_yield
    trading_calendar: us
    inception_date: "1976-06-01"
    native_frequency: '{"1976": "day"}'
  # THE FRONT END, added for the game layer (docs/game-spec.md section 3.2).
  # Equity prices how BAD a crisis is; the term structure prices how LONG.
  # A shock the market expects to pass moves the bill and leaves the long
  # bond; one it expects to persist moves the long end. The ratio between
  # them is a market-implied duration, and duration is the quantity a
  # SEQUENCE forecast is actually about — so the front end is not decoration
  # here, it is the instrument that separates a dyad's patience from its
  # cost of fighting when the event record alone cannot.
  - id: market:dgs3mo
    name: US 3-Month Treasury bill yield
    ticker: DGS3MO
    market_type: sovereign_yield
    trading_calendar: us
    inception_date: "1934-01-01"   # FRED secondary-market series; daily from 1954
    native_frequency: '{"1934": "month", "1954": "day"}'
  - id: market:dgs10
    name: US 10-Year Treasury yield
    ticker: DGS10
    market_type: sovereign_yield
    trading_calendar: us
    inception_date: "1871-01-01"   # Shiller long-rate proxy monthly; FRED daily from 1962
    native_frequency: '{"1871": "month", "1962": "day"}'
