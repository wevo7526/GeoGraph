# The curated marquee spine (build-spec decision 9): the episodes a reader
# will look for first, hand-coded so the archive's backbone does not depend on
# GDELT coverage or the LLM. CAMEO codes here are curated approximations.
# Every event cites source:mena-marquee (its per-event public-record
# provenance lives in the note).
#
# quad_class FOLLOWS THE CAMEO CODE and `packs._validate` enforces it — the
# quad class is a partition of the root codes, so a hand-written value that
# contradicts its own code is a data error, not an editorial choice. The
# Goldstein score is derived the same way at seed time and is not written here
# at all (core/ontology/crosswalks/cameo_goldstein.yaml).
#
# `phase0_candidate: true` marks the episode the first end-to-end case study
# works: the 2025 twelve-day war, carried as TWO spine events — Rising Lion
# opens it (a Friday: the US session prices it while the Gulf waits for
# Sunday), the US strike on the nuclear sites closes it (a Sunday: Tadawul
# prices it a full session before New York). first_mover flips between the
# two events, and their event windows OVERLAP — the flag-don't-average case
# (build-spec §19). Abqaiq remains the canonical calendar unit-test shape.

# The narrated episode. Lives HERE rather than in a new pack file so the
# seven-file contract (build-spec §16) is untouched, and in DATA rather than in
# the explorer so the reader-facing text is versioned with the events it
# describes. `events` must name events defined below — packs._validate checks
# it — and must match the phase0_candidate flags the transmission engine runs on.
case_study:
  slug: twelve-day-war
  title: The Twelve-Day War
  dek: >-
    Two strikes, nine days apart, on opposite halves of the trading week. The
    same conflict priced first by New York, then by Riyadh.
  summary: >-
    Israel opened the campaign before dawn on Friday 13 June 2025; the United
    States closed it with strikes on Fordow, Natanz and Esfahan in the early
    hours of Sunday 22 June. Because the Gulf and the Atlantic keep different
    weeks, the two events reached the world's markets in opposite orders — and
    the archive measures both rather than asserting either.
  reading: >-
    Three things in the measured effects. First, the first-mover flag flips:
    Rising Lion landed on a Friday, when New York and the futures pits trade
    and Tadawul is shut, so the West priced it and Riyadh waited until Sunday;
    Midnight Hammer landed on a Sunday, when Tadawul trades a full session
    before New York opens. Second, crude moved hardest and in both directions —
    up on the opening strike, then further down on the closing one, once Iran's
    telegraphed reply read as de-escalation rather than escalation. Third, the
    escalation reading does not sit where the headlines did: Israel-Iran was
    already at the archive's conflict floor from the direct exchange of April
    2024, so Rising Lion is not a departure from that dyad's normal. The
    rupture is in US-Iran, a dyad still carrying the cooperative memory of the
    2015 agreement.
  caveat: >-
    Rising Lion's six-session window contains Midnight Hammer, so its car_0_5
    effects are flagged overlapping and should not be read as a clean estimate
    of the opening strike alone. The archive flags the contamination rather
    than averaging it away.
  events:
    - event:mena-2025-rising-lion
    - event:mena-2025-midnight-hammer

