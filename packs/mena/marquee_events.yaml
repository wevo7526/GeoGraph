  - id: event:mena-2019-abqaiq
    date: "2019-09-14"
    name: Abqaiq–Khurais drone and missile attack
    cameo: "190"
    initiator: actor:ansar-allah   # claimed; attribution contested (Iran) — the note carries it
    target: actor:cow-670
    quad_class: material_conflict
    note: >-
      Half of Saudi output offline in one strike, on a SATURDAY: Tadawul's
      Sunday session reacts a full business day before any US market, Brent
      gaps ~15% at Monday's open — first_mover, calendar handling and daily
      CAR all in one worked example.
