    # entered the Iran dyad's baseline as the single most conciliatory act in
    # the archive. The approximation was not wrong at the edges, it was
    # sign-flipped.
    cameo: "1451"
    initiator: actor:cow-630
    target: actor:cow-630
    quad_class: material_conflict
    note: Second oil shock; the region's alignment map redrawn in one year.
