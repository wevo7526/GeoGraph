    note: Cooperation-side anchor — the archive is not only shocks.
  - id: event:mena-2018-jcpoa-exit
    date: "2018-05-08"
    name: US withdraws from the JCPOA
    cameo: "161"          # reduce or break relations
    initiator: actor:cow-2
