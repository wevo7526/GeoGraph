  - id: event:mena-2025-rising-lion
    date: "2025-06-13"
    name: Operation Rising Lion — Israeli strike campaign against Iran begins
    cameo: "190"
    initiator: actor:cow-666
    target: actor:cow-630
    quad_class: material_conflict
    phase0_candidate: true
    note: >-
      The twelve-day war opens in Friday's pre-dawn hours: Brent gaps on the
      Friday US/Europe session while Tadawul waits for Sunday — the reverse
      of the Abqaiq first_mover shape.
  - id: event:mena-2025-midnight-hammer
    date: "2025-06-22"
    name: Operation Midnight Hammer — US strikes Fordow, Natanz and Esfahan
    cameo: "195"          # employ aerial weapons
    initiator: actor:cow-2
    target: actor:cow-630
    quad_class: material_conflict
    phase0_candidate: true
    note: >-
      ~2am Sunday local: Tadawul prices it that morning, a full session before
      New York — then crude FALLS Monday as Iran's telegraphed reply reads as
      de-escalation. Its window overlaps Rising Lion's: flag, never average.
