# ── durable relations ────────────────────────────────────────────────────────
# COW's deep tier already carries the treaty alliances (US–Japan, US–ROK,
# US–Philippines, US–Taiwan 1954–79, China–DPRK 1961) and the IGO layer.
# Curated here: what COW cannot carry — the post-1979 Taiwan commitment and
# the standing rivalries the region's story runs on.
relations:
  - a: actor:cow-2              # United States
    b: actor:cow-713            # Taiwan
    relation_type: alliance
    valid_from: "1979-04-10"
    source: source:crs-taiwan
    note: >-
      The Taiwan Relations Act — a statutory commitment short of a mutual
      defense treaty, which is exactly the ambiguity the strait prices.
  - a: actor:cow-710            # China
    b: actor:cow-713            # Taiwan
    relation_type: rivalry
    combat: true
    valid_from: "1949-12-07"
    source: source:crs-taiwan
    note: The unresolved civil war — the region's defining dyad.
  - a: actor:cow-731            # North Korea
    b: actor:cow-732            # South Korea
    relation_type: rivalry
    combat: true
    valid_from: "1948"
    source: source:crs-taiwan
    note: Armistice, not peace; the peninsula's baseline is the 1953 line.
  - a: actor:cow-710            # China
    b: actor:cow-2              # United States
    relation_type: rivalry
    valid_from: "2018-03-22"
    source: source:crs-taiwan
    note: >-
      Dated to the Section 301 tariffs — the moment strategic competition
      became declared policy on both sides; thaw episodes do not end the
      structure.

# ── IGO spotlight ────────────────────────────────────────────────────────────
  # ── added 2026-08-16: pairs the ranking surfaced with no standing. See the
  # note in packs/mena/actors.yaml — COW codes alliances and no adversarial
  # relation, so China–Japan sat fifth on china's coercion ranking with the
  # chip reading "under no relation the archive has declared".
  - a: actor:cow-710            # China
    b: actor:cow-740            # Japan
    relation_type: rivalry
    valid_from: "2012-09-11"
    source: source:standing-record
    note: >-
      Japan's nationalisation of the Senkaku/Diaoyu islands, 2012-09-11, and
      the sustained air and maritime contest since. The wartime history is not
      the live structure; this is.
  - a: actor:cow-2              # United States
    b: actor:cow-731            # North Korea
    relation_type: rivalry
    combat: true
    valid_from: "1950-06-25"
    source: source:standing-record
    note: >-
      Belligerent from 1950; the 1953 armistice is not a peace treaty and no
      diplomatic relations have ever existed.
  - a: actor:cow-710            # China
    b: actor:cow-750            # India
    relation_type: rivalry
    combat: true
    valid_from: "1962-10-20"
    source: source:standing-record
    note: >-
      The 1962 war and the unresolved Line of Actual Control; Galwan (2020) is
      the same boundary.

# Bilateral defence treaties. Expanded by ally_windows; not RELATES_TO rows
# (COW already carries these start dates). US–Australia "use of military
# force" on the wire is co-participation in third-country operations.
alliance_blocs:
  - name: US–Japan security treaty
    valid_from: "1951-09-08"
    members: ["actor:cow-2", "actor:cow-740"]
  - name: US–ROK mutual defense
    valid_from: "1953-10-01"
    members: ["actor:cow-2", "actor:cow-732"]
  - name: US–Philippines mutual defense
    valid_from: "1951-08-30"
    members: ["actor:cow-2", "actor:cow-840"]
  - name: ANZUS
    valid_from: "1951-09-01"
    members: ["actor:cow-2", "actor:cow-900"]

igo_spotlight:
  - actor:igo-asean
  - actor:igo-apec
