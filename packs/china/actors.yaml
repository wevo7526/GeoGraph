# China pack — region two (build-spec §16, Phase 6). The Taiwan Strait is the
# flagship second story, and THE PACK PROVES THE CONTRACT: the core runs
# against this file unchanged or the contract is broken.
#
# COW ccodes anchor states to the deep tier; iso3 anchors them to GDELT's
# country codes. THIS ROSTER BOUNDS THE ARCHIVE (2026-08-16): the deep tier
# dates and enriches the actors named here and invents none — the packs define
# the scope, and an actor no pack names is pruned with everything hanging off it.

# What to CALL this lens. The pack is KEYED `china` — that string is written
# into every record's region_pack, into gdelt-china-1979-2005.tsv.gz and into
# the deployed volume, so it stays put. But the roster below is not China's
# alone: Taiwan, Japan, Korea, the US Seventh Fleet and the Strait's shipping
# are all in it, and beside MENA and EURASIA the honest caption is the region,
# not its largest state.
region_label: Asia

actors:
  # ── states ─────────────────────────────────────────────────────────────────
  - id: actor:cow-2
    name: United States
    actor_type: state
    cow_ccode: 2
    iso3: USA
