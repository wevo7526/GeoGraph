# The market universe for the China lens. EVERY MARKET CARRIES ITS INCEPTION
# DATE, and `native_frequency` is era-keyed — a market founded in 1969 whose
# feed starts in 1986 has NO measurable era before the feed, and the engine
# records the skip rather than inventing one (the fidelity gradient).
#
# Shared instruments (^GSPC, GC=F, BZ=F, DGS10) reuse the SAME node ids as
# other packs — one market, one node; the graph's region_pack tag on a shared
# market is whichever pack seeded last, and nothing load-bearing reads it.
# Asia-Pacific cash sessions are Monday–Friday; `us` is the archive's
# Mon–Fri calendar (the name is historical, the semantics are the week).

markets:
  - id: market:gspc
    name: S&P 500
    ticker: "^GSPC"
    market_type: equity_index
    trading_calendar: us
    inception_date: "1871-01-01"
    native_frequency: '{"1871": "month", "1927": "day"}'
  - id: market:hsi
    name: Hang Seng Index
    ticker: "^HSI"
    market_type: equity_index
    trading_calendar: us
    inception_date: "1969-11-24"
    native_frequency: '{"1987": "day"}'
  - id: market:twii
    name: TAIEX (Taiwan Weighted)
    ticker: "^TWII"
    market_type: equity_index
    trading_calendar: us
    inception_date: "1967-01-05"
    native_frequency: '{"1997": "day"}'
  - id: market:sse
    name: SSE Composite (Shanghai)
    ticker: "000001.SS"
    market_type: equity_index
    trading_calendar: us
    inception_date: "1990-12-19"
    native_frequency: '{"1991": "day"}'
  - id: market:n225
    name: Nikkei 225
    ticker: "^N225"
    market_type: equity_index
    trading_calendar: us
    inception_date: "1949-05-16"
    native_frequency: '{"1965": "day"}'
  - id: market:kospi
    name: KOSPI Composite
    ticker: "^KS11"
    market_type: equity_index
    trading_calendar: us
    inception_date: "1983-01-04"
    native_frequency: '{"1996": "day"}'
  # The two shared COMMODITY nodes carry the MENA pack's description verbatim,
  # and must keep carrying it. They were stated differently here until
  # 2026-08-12 (a 1988 inception for Brent, a `us` calendar for both), which
  # was inert only by accident: packs seed alphabetically, so MENA ran last
  # and its values were the ones the engine actually measured against. Two
  # descriptions of one node is one description plus a silent loser —
  # `test_shared_market_nodes_agree_across_packs` now refuses the divergence.
  - id: market:brent
    name: Brent crude
    ticker: "BZ=F"
    market_type: commodity
    trading_calendar: global_futures
    inception_date: "1861-01-01"   # long-run annual oil series; futures from 1988
    native_frequency: '{"1861": "year", "1988": "day"}'
  - id: market:gold
    name: Gold
    ticker: "GC=F"
    market_type: commodity
    trading_calendar: global_futures
    inception_date: "1905-01-01"   # long-run annual gold price; futures from 1974
    native_frequency: '{"1905": "year", "1974": "day"}'
  # THE FRONT END, added for the game layer (docs/game-spec.md section 3.2).
  # Equity prices how BAD a crisis is; the term structure prices how LONG.
  # A shock the market expects to pass moves the bill and leaves the long
  # bond; one it expects to persist moves the long end. The ratio between
  # them is a market-implied duration, and duration is the quantity a
  # SEQUENCE forecast is actually about — so the front end is not decoration
  # here, it is the instrument that separates a dyad's patience from its
  # cost of fighting when the event record alone cannot.
  - id: market:dgs3mo
    name: US 3-Month Treasury bill yield
    ticker: DGS3MO
    market_type: sovereign_yield
    trading_calendar: us
    inception_date: "1934-01-01"   # FRED secondary-market series; daily from 1954
    native_frequency: '{"1934": "month", "1954": "day"}'
  - id: market:dgs2
    name: US 2-Year Treasury yield
    ticker: DGS2
    market_type: sovereign_yield
    trading_calendar: us
    inception_date: "1976-06-01"
    native_frequency: '{"1976": "day"}'
  - id: market:dgs10
    name: US 10-Year Treasury yield
    ticker: DGS10
    market_type: sovereign_yield
    trading_calendar: us
    inception_date: "1871-01-01"
    native_frequency: '{"1871": "month", "1962": "day"}'
