# The China marquee spine — curated, day-resolution, CODED. Chosen to avoid
# double-folding dyad baselines against the COW deep tier: pre-2015 armed
# disputes live in the MIDs, so the curated rows lean diplomatic and
# economic, plus the post-2014 events the MIDs cannot carry. The CAMEO
# vocabulary has no state-visit code in the archive's table, so Nixon 1972
# and Pelosi 2022 carry 046 (engage in negotiation / high-level engagement)
# with the coding noted — the nearest scorable fit, and the market read of
# both events was the engagement itself.

