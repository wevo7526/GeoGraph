case_study:
  slug: fourth-strait-crisis
  title: The Fourth Strait Crisis
  dek: >-
    A visit and an answer, two days apart. The cooperative event and the
    coercive one priced the same island's risk in opposite directions —
    across Taipei, Hong Kong, Tokyo and New York sessions.
  summary: >-
    Speaker Pelosi landed in Taipei on the evening of 2 August 2022; on 4
    August the PLA opened the largest exercises ever conducted around
    Taiwan, with ballistic missiles overflying the island. The archive codes
    the pair as they were: a high-level engagement on the US–Taiwan dyad,
    answered by a display of force on the China–Taiwan dyad — one episode,
    two dyads, and the drills measured against a baseline the visit did not
    move.
  reading: >-
    Watch the two dyads separately. The visit is cooperative ON ITS OWN
    DYAD — Head B scores it against US–Taiwan's normal, not against
    Beijing's reaction. The drills are the escalation, and their measured
    market effect carries the overlap flag where the windows touch: the
    archive refuses to average a visit and a blockade rehearsal into one
    number.
  caveat: >-
    TAIEX and the Hang Seng carry the local read; the semiconductor channel
    (EWT, SMH in the asset layer) is where the strait's specific risk shows
    inside US hours. Measured effects are the era's daily CARs — no intraday
    exists this far back on the free feed.
  events:
    - event:china-2022-pelosi
    - event:china-2022-drills
